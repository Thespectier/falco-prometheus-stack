# 前端静态站点 + 后端反代。
#
# 整个应用挂在 /infrasecurity/ 前缀下（与网关部署一致）：
#   * 裸域名与 /infrasecurity 都 302 到 /infrasecurity/，保证前端路由的 basename 对得上
#   * 带前缀与不带前缀的两套 API 路径都反代到 api 服务，日志页的实时流也走这两个入口

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是单页应用，压缩主要省下 JS/CSS 的传输
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 网关可能只透传了不带斜杠的前缀，补一个跳转，避免相对资源解析到错误路径
    location = /infrasecurity {
        return 302 /infrasecurity/;
    }

    # 静态资源；找不到就回退到 index.html，交给前端路由处理
    location /infrasecurity/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /infrasecurity/index.html;
    }

    location / {
        return 302 /infrasecurity/;
    }

    # 不带前缀的 API（集群内直连时使用）
    location /api/ {
        proxy_pass http://43039infrasecurity-api:8000/api/;
        include /etc/nginx/snippets/proxy-headers.conf;

        # 日志页的实时流是 WebSocket，需要协议升级
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 不带前缀的网关校验接口
    location /clientsecurity/ {
        proxy_pass http://43039infrasecurity-api:8000/clientsecurity/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # 带前缀的 API（网关转发时使用）
    location /infrasecurity/api/ {
        proxy_pass http://43039infrasecurity-api:8000/infrasecurity/api/;
        include /etc/nginx/snippets/proxy-headers.conf;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 带前缀的网关校验接口
    location /infrasecurity/clientsecurity/ {
        proxy_pass http://43039infrasecurity-api:8000/infrasecurity/clientsecurity/;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
