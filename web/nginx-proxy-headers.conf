# API 反代的公共转发头（供 conf.d/default.conf 里的各个 proxy location include）。
#
# 后端要记录真实来源与协议：网关部署下 nginx 是最后一跳，不加这些头后端只能看到
# nginx 容器的地址与 http。WebSocket 的协议升级头只在需要的 location 里单独写，
# 不放这里——否则普通接口也会带上 Upgrade。

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
