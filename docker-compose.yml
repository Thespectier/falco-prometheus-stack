services:
  # 1. Falco Security Engine
  falco:
    build:
      context: .
      dockerfile: Dockerfile.falco
    container_name: 43039infrasecurity-falco
    privileged: true
    # Enable JSON output for programmatic consumption
    command: ["falco", "-o", "json_output=true", "-o", "json_include_output_fields_property=true", "-o", "webserver.enabled=false"]
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro 
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /etc:/host/etc:ro
      - /proc:/host/proc:ro

  # 2. Prometheus Exporter (Converts Falco logs to Metrics)
  exporter:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: 43039infrasecurity-exporter
    command: python prometheus/exporter.py
    environment:
      - FALCO_CONTAINER=43039infrasecurity-falco
      - PYTHONUNBUFFERED=1
    depends_on:
      - falco
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Needs access to read Falco logs

  # 3. Hanabi Worker (Processes logs for HBT & Storage)
  hanabi_worker:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: 43039infrasecurity-worker
    command: python hanabi/worker.py
    environment:
      - FALCO_CONTAINER=43039infrasecurity-falco
      - HBT_STORAGE_PATH=/app/data/hbt
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - LOG_STORAGE_DEBUG=1
      - ALERTS_INGESTOR_URL=http://43039infrasecurity-alerts-ingestor:9000
      - HANABI_WARMUP_SECONDS=${HANABI_WARMUP_SECONDS:-3600}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shared_data:/app/data
    depends_on:
      - falco

  # 4. API Backend (FastAPI)
  api:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    container_name: 43039infrasecurity-api
    command: uvicorn api.app.main:app --host 0.0.0.0 --port 8000
    environment:
      - PROMETHEUS_URL=http://43039infrasecurity-prometheus:9090
      - HBT_STORAGE_PATH=/app/data/hbt
      - DATA_DIR=/app/data
      - ACCESS_CONTROL_ENABLED=${ACCESS_CONTROL_ENABLED:-0}
      - VERIFY_TOKEN_URL=${VERIFY_TOKEN_URL:-https://www.ideas.cnpc/api/common/v1/users/current?appCode=gx06hustinfrasecurity}
    volumes:
      - shared_data:/app/data
    depends_on:
      - prometheus
      - hanabi_worker

  # 5. Frontend (React + Nginx)
  web:
    build: ./web
    container_name: 43039infrasecurity-web  
    ports:
      - "8081:80"
    environment:
      - ACCESS_CONTROL_ENABLED=${ACCESS_CONTROL_ENABLED:-0}
    depends_on:
      - api

  # 6. Prometheus (Metrics DB)
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    container_name: 43039infrasecurity-prometheus
    # Set retention to 3 days to match the project's lightweight storage policy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --storage.tsdb.retention.time=3d
    depends_on:
      - exporter

  # 8. Logs Ingestor (Falco -> logs DB)
  logs-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: 43039infrasecurity-logs-ingestor
    command: python ingestors/logs/main.py
    environment:
      - FALCO_CONTAINER=43039infrasecurity-falco
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
      - LOG_STORAGE_DEBUG=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - shared_data:/app/data
    depends_on:
      - falco

  # 9. Alerts Ingestor (Hanabi Warning(T) -> alerts DB)
  alerts-ingestor:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: 43039infrasecurity-alerts-ingestor
    command: uvicorn ingestors.alerts.main:app --host 0.0.0.0 --port 9000
    environment:
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    volumes:
      - shared_data:/app/data
    depends_on:
      - hanabi_worker

  # 10. Reducer (periodic alerts reduction -> incidents)
  reducer:
    build:
      context: .
      dockerfile: Dockerfile.reducer
    container_name: 43039infrasecurity-reducer
    command: python reducer/service.py
    environment:
      - PROMETHEUS_URL=http://43039infrasecurity-prometheus:9090
      - DATA_DIR=/app/data
      - REDUCER_INTERVAL_SECONDS=270
      - REDUCER_WINDOW_SECONDS=300
      - REDUCER_SIMILARITY=0.6
      - REDUCER_THREAT_THRESHOLD=60.0
      - REDUCER_MAX_PER_CLUSTER=1
      - PYTHONUNBUFFERED=1
    volumes:
      - shared_data:/app/data
    depends_on:
      - prometheus
      - alerts-ingestor

  # 11. Analyzer (LLM Analysis for Incidents)
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile.analyzer
    container_name: 43039infrasecurity-analyzer
    command: python analyzer/service.py
    environment:
      - DATA_DIR=/app/data
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_ENDPOINT=https://api.deepseek.com
      - DEEPSEEK_MODEL=deepseek-chat
      - PYTHONUNBUFFERED=1
    volumes:
      - shared_data:/app/data
    depends_on:
      - logs-ingestor
  # 12. DB Query Tool (Queries alerts/incidents DB)
  db-query:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: 43039infrasecurity-db-query
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - shared_data:/app/data
      - ./test:/app/test
    profiles:
      - tools

volumes:
  shared_data:
