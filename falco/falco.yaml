# 本文件基于上游 falcosecurity/falco 的默认配置（falco.yaml）裁剪而成，
# 只保留本项目实际依赖与影响运行时行为的配置项。上游项目、版本与许可证
# 见 THIRD_PARTY_NOTICES.md；镜像为 falcosecurity/falco:latest（0.44.1）。
#
# 保留原则（逐项实测得出，过程见 .dsh/similarity-refactor-progress.md 第 5 轮）：
#   1. 不写就起不来的键：规则文件、容器插件、至少一个输出
#   2. 不写就会改变可观察行为的键：规则优先级、JSON 输出格式、捕获与输出管线调优
#   3. 官方默认即"关闭"的功能一律不写（已实测：所有输出默认都是关的，
#      因此 file/http/program/grpc 输出与 capture、metrics 的细项都无需保留）

# 加载 /etc/falco/config.d 下的配置片段：container 插件与 ISO8601 时间格式
# 都在其中，而 config_files 没有内置默认值，必须显式写。
config_files:
  - /etc/falco/config.d

# 片段变更时热加载
watch_config_files: true

# 只加载自研规则：上游规则集有数千条规则并带各自优先级，本项目依赖自研的
# DEBUG 级画像规则稳定命中，加载上游规则集会让画像拿不到事件。
rules_files:
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/rules.d

# 容器插件定义。config.d 里的 falco.container_plugin.yaml 只负责把 container
# 加入 load_plugins，插件的库路径与初始化参数必须在主配置里给出。
plugins:
  - name: container
    library_path: libcontainer.so
    init_config:
      label_max_len: 100
      with_size: false

# 主机信息随事件一起上报（exporter 的指标标签会用到 k8s.* 字段）
plugins_hostinfo: true

# 采集引擎与调优：容器内用 modern_ebpf（kmod 在容器里不可用），
# 缓冲与 CPU 参数沿用现状，改小会丢事件
engine:
  kind: modern_ebpf
  modern_ebpf:
    cpus_for_each_buffer: 2
    buf_size_preset: 4
    drop_failed_exit: false

# 自研规则是 DEBUG 级，阈值必须放到 debug 才会输出；condition 互斥，
# 匹配模式沿用上游的 first
priority: debug
rule_matching: first

# 输出：stdout 供 exporter / 摄取端通过 Docker API 读取，syslog 沿用现状；
# 不缓冲，保证告警实时性；输出队列不限容量，避免突发时丢事件
stdout_output:
  enabled: true

syslog_output:
  enabled: true

buffered_outputs: false
output_timeout: 2000

outputs_queue:
  capacity: 0

append_output:
  - suggested_output: true

# 健康检查端点（compose 会用 -o webserver.enabled=false 覆盖）
webserver:
  enabled: true
  listen_port: 8765
  listen_address: 0.0.0.0
  k8s_healthz_endpoint: /healthz

# 事件以 JSON 输出供下游解析；事件里已含 output_fields，
# 不再重复输出格式化文本行，但保留 tags
json_output: true
json_include_output_property: false
json_include_message_property: false
json_include_output_fields_property: true
json_include_tags_property: true

# 日志：stderr 供 docker logs 采集
log_stderr: true
log_syslog: true
log_level: info
libs_logger:
  enabled: true
  severity: info

# 事件丢弃与超时：沿用现状，保证高压下仍能报出丢弃告警
syscall_event_timeouts:
  max_consecutives: 1000

syscall_event_drops:
  threshold: .1
  actions:
    - log
    - alert
  rate: .03333
  max_burst: 1
  simulate_drops: false

# 指标走 exporter 自己算的那一套，Falco 内置指标关闭
metrics:
  enabled: false

# 只激活规则里用到的系统调用，减少内核侧开销
base_syscalls:
  custom_set: []
  repair: false
  all: false

# 线程表与抓包长度：高并发容器场景下的容量参数，沿用现状
falco_libs:
  thread_table_size: 262144
  thread_table_auto_purging_interval_s: 300
  thread_table_auto_purging_thread_timeout_s: 300
  snaplen: 80
